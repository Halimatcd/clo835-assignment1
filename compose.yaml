# CLO835 - Assignment 1 - the whole stack in one command.
#
#   docker compose up -d      start everything
#   docker compose ps         see it running
#   docker compose down -v    stop it and delete the volume
#
# All services join the custom bridge network "clo835-net", so the web tier
# reaches the data tier by the service name "mysql-db". No IP address is needed.

services:
  mysql-db:
    build:
      context: .
      dockerfile: Dockerfile_mysql
    image: halimatcd/clo835-mysql:v1
    environment:
      MYSQL_ROOT_PASSWORD: pw
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - clo835-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppw"]
      interval: 5s
      timeout: 5s
      retries: 20

  blue:
    build: .
    image: halimatcd/clo835-webapp:v1
    ports: ["8081:8080"]
    environment: &app_env
      DBHOST: mysql-db
      DBPORT: "3306"
      DBUSER: root
      DBPWD: pw
      DATABASE: employees
      APP_COLOR: blue
    networks:
      - clo835-net
    depends_on:
      mysql-db:
        condition: service_healthy

  pink:
    image: halimatcd/clo835-webapp:v1
    ports: ["8082:8080"]
    environment:
      <<: *app_env
      APP_COLOR: pink
    networks:
      - clo835-net
    depends_on:
      mysql-db:
        condition: service_healthy

  lime:
    image: halimatcd/clo835-webapp:v1
    ports: ["8083:8080"]
    environment:
      <<: *app_env
      APP_COLOR: lime
    networks:
      - clo835-net
    depends_on:
      mysql-db:
        condition: service_healthy

networks:
  clo835-net:
    driver: bridge

volumes:
  mysql-data:
